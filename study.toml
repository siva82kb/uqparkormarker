# Study design. Every design choice lives here, not in the code.
# Clips record a copy of this file (design.toml); if the two ever differ,
# the app refuses to mix them.

[source]
# The .vidt frame times are local wall-clock time. Brisbane is UTC+10 all year.
utc_offset_hours = 10

[timing]
# The recorder sometimes stamps frames late. A late stretch shows as a pause
# in the timestamps followed by repeated timestamps. A window is sampled only
# if none of its frames repeats a timestamp and no step between its frames is
# longer than this (see parkour/timing.py).
max_step_seconds = 0.1

[sampling]
strategy = "uniform"      # a module name in parkour/sampling/
n_segments = 25           # upper limit per subject
task_share = 0.7          # share of clips taken from task video; the rest come from unlabelled video
window_seconds = 1.0      # every clip is this long at the video's frame rate (30 frames at 30 fps)
seed = 20221125           # fixed, so every rater gets the same windows

[clips]
# H.264 quality: lower is sharper and larger. 18 is visually lossless.
crf = 18

[[labels]]
key = "1"
name = "Task-related functional"

[[labels]]
key = "2"
name = "Non-task-related functional"

[[labels]]
key = "3"
name = "Non-functional"

[[labels]]
key = "4"
name = "No activity/movement"

[[labels]]
key = "5"
name = "Unknown / arm out of view"
