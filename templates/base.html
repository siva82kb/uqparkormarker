<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}UQ Parkour Annotator{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body{% if dev_stamp_url %} data-dev-stamp-url="{{ dev_stamp_url }}"{% endif %}>
  <header class="site-header">
    <a class="brand" href="{{ url_for('home') }}">UQ Parkour Annotator</a>
    <nav class="site-nav" aria-label="Sections">
      {% set here = request.endpoint or '' %}
      <a href="{{ url_for('summary_page') }}" {% if here == 'summary_page' %}aria-current="page"{% endif %}>Data summary</a>
      <a href="{{ url_for('annotation_summary') }}" {% if here == 'annotation_summary' %}aria-current="page"{% endif %}>Annotation summary</a>
      <a href="{{ url_for('docs_index') }}" {% if here.startswith('docs') %}aria-current="page"{% endif %}>Docs</a>
    </nav>
    {% if rater %}<span class="site-who">{{ rater }}{% if open_subject %} · {{ open_subject }}{% endif %}</span>{% endif %}
  </header>
  <main class="page {% block page_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
